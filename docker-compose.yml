name: ${COMPOSE_PROJECT_NAME:-app}

services:
  storage-init:
    image: ${COMPOSE_PROJECT_NAME:-app}-backend:${TAG:-latest}
    pull_policy: never
    user: "0:0"
    command: ["python", "-c", "import os; os.makedirs('/data', exist_ok=True); os.chown('/data', 1000, 1000)"]
    volumes:
      - catalog-data:/data

  migrate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    user: "1000:1000"
    environment:
      DATABASE_URL: sqlite:/data/app.db
      DBMATE_MIGRATIONS_DIR: /migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
      DBMATE_STRICT: "true"
      DBMATE_WAIT: "true"
    command: ["up"]
    volumes:
      - catalog-data:/data
      - ./backend/migrations/sqlite:/migrations:ro
    depends_on:
      storage-init:
        condition: service_completed_successfully

  seed:
    image: ${COMPOSE_PROJECT_NAME:-app}-backend:${TAG:-latest}
    pull_policy: never
    command: ["python", "-m", "app.seed_catalog", "--database", "/data/app.db"]
    volumes:
      - catalog-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    environment:
      DATABASE_PATH: /data/app.db
      STAND_PACK: /srv/data/stand/pack.json.gz
    volumes:
      - catalog-data:/data
      - ./data/stand:/srv/data/stand:ro
    depends_on:
      seed:
        condition: service_completed_successfully
    image: ${COMPOSE_PROJECT_NAME:-app}-backend:${TAG:-latest}
    pull_policy: never
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    image: ${COMPOSE_PROJECT_NAME:-app}-frontend:${TAG:-latest}
    pull_policy: never
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  catalog-data:
