[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "pyarrow>=26.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
prepare-data = "app.prepare_data:main"
baseline = "app.run_baseline:main"
stand-pack = "app.build_stand_pack:main"

[dependency-groups]
llm = [
    "claude-agent-sdk>=0.2.166",
    "openai-codex>=0.162.1",
]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-xdist>=3.8",
    "ruff>=0.14",
]

[tool.uv]
default-groups = ["dev", "llm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-n", "auto", "--strict-markers"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
