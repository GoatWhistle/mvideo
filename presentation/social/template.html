<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Social images</title>
<link rel="stylesheet" href="../src/core/css/tokens.css">
<link rel="stylesheet" href="../src/core/css/fonts.css">
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  display: grid;
  gap: 40px;
  padding: 40px;
  background: var(--neutral-500);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}

template,
#icons {
  display: none;
}

.post {
  position: relative;
  display: grid;
  grid-template-rows: auto 1fr auto;
  width: 1080px;
  height: 1350px;
  overflow: hidden;
  padding: 88px;
  background: var(--surface-base);
  color: var(--text-primary);
}

.post.is-sunken {
  background: var(--surface-sunken);
}

.post.is-accent {
  --muted: color-mix(in oklab, var(--action-primary-text) 78%, transparent);
  background: var(--action-primary);
  color: var(--action-primary-text);
}

.post.is-accent .kicker,
.post.is-accent .value {
  color: var(--action-primary-text);
}

.post.is-accent .lead,
.post.is-accent .source,
.post.is-accent .bottom,
.post.is-accent .who span,
.post.is-accent .kpi span {
  color: var(--muted);
}

.post.is-accent em {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 0.07em;
  text-underline-offset: 0.12em;
}

.post.is-accent .mark-base {
  fill: var(--action-primary-text);
}

.post.is-accent .mark-accent {
  fill: var(--text-primary);
}

.post.is-accent .chip {
  border-color: var(--muted);
  color: var(--action-primary-text);
}

.post.is-accent .quote-mark,
.post.is-accent .avatar {
  background: var(--action-primary-text);
  color: var(--action-primary);
}

.post.v-2 .mid {
  justify-items: center;
  text-align: center;
}

.post.v-2 .steps li,
.post.v-2 .people li,
.post.v-2 .items li {
  text-align: left;
}

.post.v-2 .frame {
  width: 100%;
  transform: rotate(-2deg);
}

.post.v-3 .mid::before {
  content: "";
  width: 120px;
  height: 14px;
  border-radius: var(--radius-pill);
  background: var(--action-primary);
}

.post.v-3.is-accent .mid::before {
  background: var(--action-primary-text);
}

.post.v-3 .mid:has(.quote-mark)::before {
  display: none;
}

.post .watermark {
  position: absolute;
  right: -120px;
  bottom: -120px;
  width: 620px;
  height: 620px;
  opacity: 0.07;
  pointer-events: none;
}

.post.v-4 .frame {
  transform: rotate(2deg);
}

.post.v-5::after {
  content: "";
  position: absolute;
  inset: 36px;
  border: 3px solid var(--border-strong);
  border-radius: var(--radius-lg);
  pointer-events: none;
}

.post.v-5.is-accent::after {
  border-color: var(--action-primary-text);
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.lockup {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 34px;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.mark {
  display: block;
  width: 48px;
  height: 48px;
}

.mark svg {
  display: block;
  width: 100%;
  height: 100%;
}

.mark-base {
  fill: var(--text-primary);
}

.mark-accent {
  fill: var(--action-primary);
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  height: 56px;
  padding: 0 24px;
  border: 2px solid var(--border-strong);
  border-radius: var(--radius-pill);
  font-size: 28px;
  font-weight: 600;
  color: var(--text-secondary);
  white-space: nowrap;
}

.chip.is-accent {
  border-color: var(--action-primary);
  background: var(--action-primary);
  color: var(--action-primary-text);
}

.mid {
  display: grid;
  align-content: center;
  gap: 48px;
  min-height: 0;
}

.bottom {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 32px;
  font-size: 28px;
  color: var(--text-muted);
}

.kicker {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 30px;
  font-weight: 600;
  color: var(--action-primary);
}

.hook {
  font-size: 104px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.04em;
  text-wrap: balance;
}

.hook em,
.title em,
.quote em {
  font-style: normal;
  color: var(--action-primary);
}

.title {
  font-size: 72px;
  font-weight: 700;
  line-height: 1.04;
  letter-spacing: -0.03em;
  text-wrap: balance;
}

.lead {
  font-size: 38px;
  line-height: 1.3;
  color: var(--text-secondary);
  text-wrap: pretty;
}

.value {
  font-family: var(--font-mono);
  font-size: 260px;
  font-weight: 700;
  line-height: 0.9;
  letter-spacing: -0.06em;
  color: var(--action-primary);
  white-space: nowrap;
}

.value small {
  margin-left: 16px;
  font-size: 0.26em;
  letter-spacing: 0;
  color: var(--text-muted);
}

.source {
  font-size: 28px;
  line-height: 1.3;
  color: var(--text-muted);
}

.ico {
  display: inline-grid;
  flex: none;
  width: 44px;
  height: 44px;
}

.ico svg {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.tile {
  display: grid;
  place-items: center;
  flex: none;
  width: 96px;
  height: 96px;
  border: 2px solid var(--border-strong);
  border-radius: 50%;
  background: var(--surface-raised);
}

.tile.is-accent {
  border-color: var(--action-primary);
  background: var(--action-primary);
  color: var(--action-primary-text);
}

.steps {
  display: grid;
  gap: 36px;
  list-style: none;
}

.steps li {
  display: grid;
  grid-template-columns: 96px 1fr;
  align-items: center;
  gap: 36px;
}

.steps b {
  display: block;
  font-size: 44px;
  line-height: 1.1;
  letter-spacing: -0.02em;
}

.steps span:not(.tile, .ico) {
  display: block;
  margin-top: 8px;
  font-size: 30px;
  line-height: 1.3;
  color: var(--text-secondary);
}

.frame {
  position: relative;
  overflow: hidden;
  height: 720px;
  border: 2px solid var(--border-strong);
  border-radius: var(--radius-lg);
  background: var(--surface-raised);
  box-shadow: var(--shadow-float);
}

.frame img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: left top;
}

.frame.is-empty::after {
  content: "";
  position: absolute;
  inset: 36px;
  border: 3px dashed var(--border-subtle);
  border-radius: var(--radius-md);
}

.zoom {
  position: absolute;
  right: 40px;
  bottom: 40px;
  width: 340px;
  height: 340px;
  overflow: hidden;
  border: 10px solid var(--action-primary);
  border-radius: 50%;
  background: var(--surface-raised);
  box-shadow: var(--shadow-float);
}

.zoom img {
  position: absolute;
  max-width: none;
}

.pair {
  display: grid;
  gap: 32px;
}

.side {
  display: grid;
  gap: 12px;
  padding: 40px 48px;
  border-radius: var(--radius-lg);
  background: var(--surface-sunken);
}

.side.is-after {
  background: var(--action-primary);
  color: var(--action-primary-text);
}

.side .label {
  font-size: 32px;
  font-weight: 600;
}

.side .num {
  font-family: var(--font-mono);
  font-size: 150px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.05em;
  white-space: nowrap;
}

.side:not(.is-after) .num {
  color: var(--text-muted);
  text-decoration: line-through;
  text-decoration-thickness: 8px;
}

.turn {
  display: grid;
  place-items: center;
  width: 96px;
  height: 96px;
  margin: -64px auto;
  position: relative;
  z-index: 1;
  border: 6px solid var(--surface-base);
  border-radius: 50%;
  background: var(--text-primary);
  color: var(--surface-base);
}

.kpis {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
}

.kpi {
  display: grid;
  align-content: start;
  gap: 10px;
  padding: 40px;
  border: 2px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  background: var(--surface-raised);
}

.kpi:first-child {
  border-color: var(--action-primary);
}

.kpi b {
  font-family: var(--font-mono);
  font-size: 88px;
  line-height: 1;
  letter-spacing: -0.04em;
  white-space: nowrap;
}

.kpi:first-child b {
  color: var(--action-primary);
}

.kpi span {
  font-size: 30px;
  line-height: 1.25;
  color: var(--text-secondary);
}

.quote {
  font-size: 76px;
  font-weight: 650;
  line-height: 1.1;
  letter-spacing: -0.03em;
  text-wrap: balance;
}

.quote-mark {
  width: 120px;
  height: 16px;
  border-radius: var(--radius-pill);
  background: var(--action-primary);
}

.who {
  display: flex;
  align-items: center;
  gap: 28px;
}

.avatar {
  display: grid;
  place-items: center;
  flex: none;
  width: 120px;
  height: 120px;
  overflow: hidden;
  border-radius: 50%;
  background: var(--action-primary);
  color: var(--action-primary-text);
  font-size: 44px;
  font-weight: 700;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.who b {
  display: block;
  font-size: 40px;
}

.who span {
  font-size: 30px;
  color: var(--text-secondary);
}

.people {
  display: grid;
  gap: 32px;
  list-style: none;
}

.people li {
  display: grid;
  grid-template-columns: 120px 1fr;
  align-items: center;
  gap: 32px;
  padding-bottom: 32px;
  border-bottom: 2px solid var(--border-subtle);
}

.people b {
  display: block;
  font-size: 42px;
}

.people span {
  font-size: 30px;
  line-height: 1.3;
  color: var(--text-secondary);
}

.items {
  display: grid;
  gap: 40px;
  list-style: none;
  counter-reset: item;
}

.items li {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 32px;
  font-size: 40px;
  line-height: 1.25;
  counter-increment: item;
}

.items li::before {
  content: counter(item);
  display: grid;
  place-items: center;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--action-primary);
  font-family: var(--font-mono);
  font-size: 36px;
  font-weight: 700;
  color: var(--action-primary-text);
}

</style>
</head>
<body>

<div id="out"></div>

<template id="layout-cover">
  <section class="post">
    <div class="top"><span class="lockup"><span class="mark" data-mark></span><span data-slot="product"></span></span><span class="chip" data-slot="hackathon"></span></div>
    <div class="mid">
      <p class="kicker" data-slot="kicker"></p>
      <h1 class="hook" data-slot="hook" data-fit="4"></h1>
      <p class="lead" data-slot="text" data-fit="3"></p>
    </div>
    <div class="bottom"><span data-slot="author"></span></div>
  </section>
</template>

<template id="layout-number">
  <section class="post">
    <div class="top"><span class="lockup"><span class="mark" data-mark></span><span data-slot="product"></span></span></div>
    <div class="mid">
      <p class="kicker" data-slot="kicker"></p>
      <div class="value" data-slot="value" data-fit="1"></div>
      <h2 class="title" data-slot="title" data-fit="3"></h2>
    </div>
    <div class="bottom"><span class="source" data-slot="source"></span></div>
  </section>
</template>

<template id="layout-versus">
  <section class="post">
    <div class="top"><span class="lockup"><span class="mark" data-mark></span><span data-slot="product"></span></span></div>
    <div class="mid">
      <h2 class="title" data-slot="title" data-fit="2"></h2>
      <div class="pair">
        <div class="side"><span class="label" data-slot="before-label"></span><span class="num" data-slot="before-value" data-fit="1"></span></div>
        <span class="turn"><span class="ico" data-icon="arrow-down"></span></span>
        <div class="side is-after"><span class="label" data-slot="after-label"></span><span class="num" data-slot="after-value" data-fit="1"></span></div>
      </div>
    </div>
    <div class="bottom"><span class="source" data-slot="source"></span></div>
  </section>
</template>

<template id="layout-steps">
  <section class="post">
    <div class="top"><span class="lockup"><span class="mark" data-mark></span><span data-slot="product"></span></span></div>
    <div class="mid">
      <h2 class="title" data-slot="title" data-fit="2"></h2>
      <ol class="steps" data-list="steps"></ol>
    </div>
    <div class="bottom"><span class="source" data-slot="source"></span></div>
  </section>
</template>

<template id="layout-shot">
  <section class="post">
    <div class="top"><span class="lockup"><span class="mark" data-mark></span><span data-slot="product"></span></span><span class="chip is-accent" data-slot="badge"></span></div>
    <div class="mid">
      <h2 class="title" data-slot="title" data-fit="2"></h2>
      <figure class="frame" data-img="shot"><div class="zoom" data-zoom></div></figure>
    </div>
    <div class="bottom"><span class="source" data-slot="source"></span></div>
  </section>
</template>

<template id="layout-kpis">
  <section class="post">
    <div class="top"><span class="lockup"><span class="mark" data-mark></span><span data-slot="product"></span></span></div>
    <div class="mid">
      <h2 class="title" data-slot="title" data-fit="2"></h2>
      <div class="kpis" data-list="kpis"></div>
    </div>
    <div class="bottom"><span class="source" data-slot="source"></span></div>
  </section>
</template>

<template id="layout-quote">
  <section class="post">
    <div class="top"><span class="lockup"><span class="mark" data-mark></span><span data-slot="product"></span></span></div>
    <div class="mid">
      <span class="quote-mark"></span>
      <p class="quote" data-slot="quote" data-fit="6"></p>
    </div>
    <div class="who"><span class="avatar" data-avatar></span><span><b data-slot="name"></b><span data-slot="role"></span></span></div>
  </section>
</template>

<template id="layout-team">
  <section class="post">
    <div class="top"><span class="lockup"><span class="mark" data-mark></span><span data-slot="product"></span></span><span class="chip" data-slot="hackathon"></span></div>
    <div class="mid">
      <h2 class="title" data-slot="title" data-fit="2"></h2>
      <ul class="people" data-list="people"></ul>
    </div>
    <div class="bottom"><span class="source" data-slot="source"></span></div>
  </section>
</template>

<template id="layout-list">
  <section class="post">
    <div class="top"><span class="lockup"><span class="mark" data-mark></span><span data-slot="product"></span></span></div>
    <div class="mid">
      <h2 class="title" data-slot="title" data-fit="2"></h2>
      <ol class="items" data-list="items"></ol>
    </div>
    <div class="bottom"><span class="source" data-slot="source"></span></div>
  </section>
</template>


</body>
</html>
