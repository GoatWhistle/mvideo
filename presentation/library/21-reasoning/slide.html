<section class="slide" id="reasoning" data-title="Решение с обоснованием">
  <h2 class="title a">{{Каждое изменение}}, <em>{{со своим основанием и числом}}</em></h2>

  <div class="body">
    <div class="rs">
      <div class="rs-row">
        <div class="kpi a" style="--d:0.3s"><span class="kpi-label">{{Что меняем}}</span><span class="kpi-value"><span class="strike">{{100}}</span> {{50}}<small>{{т/ч}}</small></span></div>
        <span class="tile is-accent pop" style="--d:0.6s"><span class="ico" data-icon="arrow-right"></span></span>
        <div class="card a" style="--d:0.7s"><span class="eyebrow">{{Основание}}</span><h3>{{Почему так}}</h3><p>{{Расчёт или правило, с числом: 15,26 больше предела 10}}</p></div>
      </div>
      <div class="rs-row">
        <div class="kpi a" style="--d:0.9s"><span class="kpi-label">{{Что меняем}}</span><span class="kpi-value"><span class="strike">{{10}}</span> {{0}}<small>{{%}}</small></span></div>
        <span class="tile is-accent pop" style="--d:1.2s"><span class="ico" data-icon="arrow-right"></span></span>
        <div class="card a" style="--d:1.3s"><span class="eyebrow">{{Основание}}</span><h3>{{Почему так}}</h3><p>{{Расчёт или правило, с числом}}</p></div>
      </div>
    </div>
  </div>
</section>
