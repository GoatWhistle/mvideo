<section class="slide" id="market" data-title="Рынок">
  <h2 class="title a">{{Кто платит}}, <em>{{и сколько их на самом деле}}</em></h2>

  <div class="body">
    <div class="grid is-split mk">
      <div class="mk-rings">
        <span class="mk-ring is-1 s" style="--d:0.3s"><b>{{TAM}}</b></span>
        <span class="mk-ring is-2 s" style="--d:0.5s"><b>{{SAM}}</b></span>
        <span class="mk-ring is-3 s" style="--d:0.7s"><b>{{SOM}}</b></span>
      </div>
      <div class="stack is-center mk-list">
        <div class="kpi a" style="--d:0.4s"><span class="kpi-label">{{Все, у кого есть задача}}</span><span class="kpi-value">{{12 000}}<small>{{организаций}}</small></span><span class="kpi-note">{{источник и год}}</span></div>
        <div class="kpi a" style="--d:0.6s"><span class="kpi-label">{{Кого можем обслужить}}</span><span class="kpi-value">{{3 400}}</span><span class="kpi-note">{{критерий отбора}}</span></div>
        <div class="kpi is-accent a" style="--d:0.8s"><span class="kpi-label">{{Первые клиенты}}</span><span class="kpi-value">{{120}}</span><span class="kpi-note">{{как дойдём до них}}</span></div>
      </div>
    </div>
  </div>
</section>
