<section class="slide" id="funnel-circles" data-title="Отбор">
  <h2 class="title a">{{Из всех вариантов остаются немногие}}, <em>{{и каждый с причиной}}</em></h2>

  <div class="body">
    <div class="fc">
      <div class="fc-stage a" style="--d:0.3s"><span class="fc-circle is-lg">{{271}}</span><b>{{рассчитанный}}</b><span class="caption">{{сколько всего вариантов}}</span></div>
      <span class="ico f" style="--d:0.6s" data-icon="arrow-right"></span>
      <div class="fc-stage a" style="--d:0.7s"><span class="fc-circle">{{23}}</span><b>{{допустимых}}</b><span class="caption">{{прошли проверки}}</span></div>
      <span class="ico f" style="--d:1s" data-icon="arrow-right"></span>
      <div class="fc-stage a" style="--d:1.1s"><span class="fc-circle is-accent">{{1}}</span><b>{{выбранный}}</b><span class="caption">{{лучший по критерию}}</span></div>
    </div>
    <div class="grid is-2 fc-why">
      <p class="card is-sunken a" style="--d:1.3s"><span class="eyebrow"><span class="ico is-sm" data-icon="x"></span>{{Почему отсекли}}</span>{{Причина с числом}}</p>
      <p class="card is-sunken a" style="--d:1.45s"><span class="eyebrow"><span class="ico is-sm" data-icon="check"></span>{{Почему выбрали этот}}</span>{{Причина с числом}}</p>
    </div>
  </div>
</section>
