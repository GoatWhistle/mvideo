<section class="slide" id="cycle" data-title="Цикл">
  <h2 class="title a">{{Цикл повторяется}}, <em>{{пока не достигнута цель}}</em></h2>

  <div class="body">
    <div class="grid is-split">
      <div class="stack is-center">
        <p class="lead a" style="--d:0.3s">{{Что происходит за один оборот и почему это быстрее, чем раньше}}</p>
        <ul class="list a" style="--d:0.5s">
          <li><span><b>{{Как проверяем}}:</b> {{метрика}}</span></li>
          <li><span><b>{{Когда останавливаемся}}:</b> {{условие}}</span></li>
          <li><span><b>{{Что сохраняем}}:</b> {{журнал}}</span></li>
        </ul>
      </div>
      <div class="dg">
        <svg viewBox="0 0 860 580" aria-hidden="true">
          <circle class="trace is-muted dr" pathLength="1" style="--d:0.4s;--t:1.4s" cx="430" cy="290" r="210" />
        </svg>
        <div class="dg-node s" style="--x:430px;--y:80px;--d:0.6s;--w:220px"><span class="tile is-accent"><span class="ico" data-icon="sparkle"></span></span><b>{{Гипотеза}}</b></div>
        <div class="dg-node s" style="--x:640px;--y:290px;--d:0.8s;--w:220px"><span class="tile"><span class="ico" data-icon="zap"></span></span><b>{{Действие}}</b></div>
        <div class="dg-node s" style="--x:430px;--y:500px;--d:1s;--w:220px"><span class="tile"><span class="ico" data-icon="eye"></span></span><b>{{Наблюдение}}</b></div>
        <div class="dg-node s" style="--x:220px;--y:290px;--d:1.2s;--w:220px"><span class="tile"><span class="ico" data-icon="check"></span></span><b>{{Вывод}}</b></div>
      </div>
    </div>
  </div>
</section>
