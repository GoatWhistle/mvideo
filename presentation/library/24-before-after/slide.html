<section class="slide" id="before-after" data-title="Сегодня и с продуктом">
  <h2 class="title a">{{Тот же случай}}, <em>{{сегодня и с продуктом}}</em></h2>

  <div class="body">
    <div class="ba">
      <article class="card is-sunken a" style="--d:0.3s">
        <span class="eyebrow">{{Сегодня}}</span>
        <span class="kpi-value strike">{{2 ч}}</span>
        <ul class="list is-icons">
          <li><span class="ico is-sm" data-icon="x"></span><span>{{Что делают вручную}}</span></li>
          <li><span class="ico is-sm" data-icon="x"></span><span>{{Где ошибаются}}</span></li>
          <li><span class="ico is-sm" data-icon="x"></span><span>{{Чего не видят}}</span></li>
        </ul>
      </article>
      <span class="tile is-accent pop" style="--d:0.8s"><span class="ico" data-icon="arrow-right"></span></span>
      <article class="card is-accent a" style="--d:0.9s">
        <span class="eyebrow">{{С продуктом}}</span>
        <span class="kpi-value ba-new">{{40 с}}</span>
        <ul class="list is-icons">
          <li><span class="ico is-sm" data-icon="check"></span><span>{{Что делает продукт}}</span></li>
          <li><span class="ico is-sm" data-icon="check"></span><span>{{Что проверяется кодом}}</span></li>
          <li><span class="ico is-sm" data-icon="check"></span><span>{{Что видно сразу}}</span></li>
        </ul>
      </article>
    </div>
  </div>
</section>
