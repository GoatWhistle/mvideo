<section class="slide" id="versus-bars" data-title="Быстрее в разы" data-steps="1">
  <h2 class="title a">{{Оценка за секунды}}, <em>{{а не за минуты}}</em></h2>

  <div class="body">
    <div class="vb">
      <div class="vb-group">
        <h3 class="a" style="--d:0.3s">{{Одна задача}}</h3>
        <div class="meter">
          <div class="meter-row"><span>{{Сегодня}}</span><span class="meter-track"><i class="meter-fill" style="--w:1;--d:0.5s"></i></span><span class="meter-value">{{621 с}}</span></div>
          <div class="meter-row is-ours"><span>{{PRODUCT}}</span><span class="meter-track"><i class="meter-fill" style="--w:0.02;--d:0.7s"></i></span><span class="meter-value">{{1,0 с}}</span></div>
        </div>
        <span class="vb-delta kpi-value f" style="--d:1s">{{x610}}</span>
      </div>
      <div class="vb-group">
        <h3 class="a" style="--d:0.6s">{{Перебор вариантов}}</h3>
        <div class="meter">
          <div class="meter-row"><span>{{Сегодня}}</span><span class="meter-track"><i class="meter-fill" style="--w:1;--d:0.8s"></i></span><span class="meter-value">{{21,6 ч}}</span></div>
          <div class="meter-row is-ours"><span>{{PRODUCT}}</span><span class="meter-track"><i class="meter-fill" style="--w:0.05;--d:1s"></i></span><span class="meter-value">{{7 мин}}</span></div>
        </div>
        <span class="vb-delta kpi-value f" style="--d:1.3s">{{x185}}</span>
      </div>
    </div>
  </div>
  <div class="foot"><p class="limit" data-s="1"><b>{{Как мерили}}.</b> {{Железо, выборка, дата и команда замера}}</p></div>
</section>
