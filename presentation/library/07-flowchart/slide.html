<section class="slide" id="flowchart" data-title="Схема с отказом">
  <h2 class="title a">{{Ответ выходит только после проверки}}, <em>{{иначе отказ с причиной}}</em></h2>

  <div class="body">
    <div class="dg">
      <svg viewBox="0 0 1680 580" aria-hidden="true">
        <path class="trace is-muted dr" pathLength="1" style="--d:0.4s" d="M120 220 H1500" />
        <path class="trace is-danger is-dashed dr" pathLength="1" style="--d:1.3s" d="M1342 220 C1342 400 1400 470 1456 470" />
      </svg>
      <div class="dg-node a" style="--x:120px;--y:220px;--d:0.3s"><span class="tile"><span class="ico" data-icon="database"></span></span><b>{{Данные}}</b><span>{{что приходит}}</span></div>
      <div class="dg-node a" style="--x:470px;--y:220px;--d:0.5s"><span class="tile"><span class="ico" data-icon="trending"></span></span><b>{{Прогноз}}</b><span>{{что считаем}}</span></div>
      <div class="dg-node a" style="--x:820px;--y:220px;--d:0.7s"><span class="tile"><span class="ico" data-icon="sliders"></span></span><b>{{Ядро}}</b><span>{{что выбирает}}</span></div>
      <div class="dg-node a" style="--x:1180px;--y:220px;--d:0.9s"><span class="tile"><span class="ico" data-icon="lock"></span></span><b>{{Проверка кодом}}</b><span>{{какие запреты}}</span></div>
      <div class="dg-node a" style="--x:1500px;--y:220px;--d:1.1s"><span class="tile is-accent"><span class="ico" data-icon="check"></span></span><b>{{Ответ}}</b><span>{{кому и с чем}}</span></div>
      <div class="dg-node a" style="--x:1500px;--y:470px;--d:1.5s"><span class="tile is-danger"><span class="ico" data-icon="x"></span></span><b>{{Отказ с причиной}}</b><span>{{что видит пользователь}}</span></div>
    </div>
  </div>
</section>
