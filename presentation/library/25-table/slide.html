<section class="slide" id="table" data-title="Таблица" data-steps="1">
  <h2 class="title a">{{Каждая роль видит}}, <em>{{только свой вход}}</em></h2>

  <div class="body">
    <div class="tbl tb">
      <div class="tbl-row is-head f" style="--d:0.2s"><span>{{Роль}}</span><span>{{Что получает}}</span><span>{{Что возвращает}}</span></div>
      <div class="tbl-row a" style="--d:0.3s"><b class="mono">{{intent}}</b><span>{{вход}}</span><span>{{выход}}</span></div>
      <div class="tbl-row a" style="--d:0.4s"><b class="mono">{{entities}}</b><span>{{вход}}</span><span>{{выход}}</span></div>
      <div class="tbl-row is-ours a" style="--d:0.5s"><b class="mono">{{match}}</b><span>{{вход}}</span><span>{{выход}}</span></div>
      <div class="tbl-row a" style="--d:0.6s"><b class="mono">{{flow}}</b><span>{{вход}}</span><span>{{выход}}</span></div>
    </div>
  </div>
  <div class="foot"><p class="limit" data-s="1"><b>{{Гарантия}}.</b> {{Что проверяет сервер, прежде чем принять ответ модели}}</p></div>
</section>
