<section class="slide" id="bars-table" data-title="Классификатор">
  <h2 class="title a">{{Каждое решение}}, <em>{{с основанием и уверенностью}}</em></h2>

  <div class="body">
    <div class="grid is-split-r">
      <div class="meter bt">
        <div class="meter-row a" style="--d:0.3s"><span class="mono">{{gold}}</span><span class="meter-track"><i class="meter-fill" style="--w:0.92;--d:0.5s"></i></span><span class="meter-value">{{0,92}}</span></div>
        <div class="meter-row a" style="--d:0.4s"><span class="mono">{{reference}}</span><span class="meter-track"><i class="meter-fill" style="--w:0.81;--d:0.6s"></i></span><span class="meter-value">{{0,81}}</span></div>
        <div class="meter-row is-ours a" style="--d:0.5s"><span class="mono">{{archive}}</span><span class="meter-track"><i class="meter-fill" style="--w:0.74;--d:0.7s"></i></span><span class="meter-value">{{0,74}}</span></div>
        <div class="meter-row a" style="--d:0.6s"><span class="mono">{{catalog}}</span><span class="meter-track"><i class="meter-fill" style="--w:0.55;--d:0.8s"></i></span><span class="meter-value">{{0,55}}</span></div>
        <div class="meter-row is-danger a" style="--d:0.7s"><span class="mono">{{none}}</span><span class="meter-track"><i class="meter-fill" style="--w:0.12;--d:0.9s"></i></span><span class="meter-value">{{отказ}}</span></div>
      </div>
      <div class="card a" style="--d:0.8s">
        <span class="eyebrow"><span class="ico is-sm" data-icon="file"></span>{{Живой пример}}</span>
        <h3>{{Входная запись}}</h3>
        <p>{{Какой источник сработал первым и почему}}</p>
        <span class="badge is-accent">{{Решение: код или класс}}</span>
      </div>
    </div>
  </div>
</section>
